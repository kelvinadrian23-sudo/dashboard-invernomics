<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light}</style>
<title>Dashboard Invernomics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<style>
:root{--navy:#162A41;--navy2:#0A1D27;--green:#B9C965;--green2:#8FA63E;--teal:#2E86AB;--amber:#E0A43B;--bg:#F1F3F6;--card:#fff;--ink:#1a2330;--muted:#6b7585;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Segoe UI',Arial,Helvetica,sans-serif;color:var(--ink);}
.wrap{max-width:960px;margin:0 auto;padding:16px;}
.header{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:14px;}
.header img{height:52px;width:auto;background:#fff;border-radius:8px;padding:4px;}
.header .t{flex:1}
.header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
.header .sub{font-size:12px;opacity:.85;margin-top:2px}
.header .meta{text-align:right;font-size:11px;opacity:.8;line-height:1.5}
.header .meta b{color:var(--green);font-size:13px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 4px;}
.filters .lbl{font-size:12px;color:var(--muted);font-weight:600;margin-right:4px}
.chip{border:1.5px solid var(--navy);color:var(--navy);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s;}
.chip:hover{background:#eef1f6}
.chip.active{background:var(--navy);color:#fff}
.kpis{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.kpi{flex:1;min-width:150px;background:var(--card);border-radius:12px;padding:15px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi .v{font-size:28px;font-weight:800;line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi .s{font-size:11px;color:var(--green2);margin-top:3px;font-weight:600}
.card{background:var(--card);border-radius:14px;padding:16px;margin-top:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:15px;margin:0 0 2px;color:var(--navy)}
.card .desc{font-size:12px;color:var(--muted);margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.row .card{flex:1;min-width:300px;margin-top:0}
.chartbox{position:relative;height:230px}
.insight{font-size:12px;color:#2f4a66;background:#eef3f8;border-left:3px solid var(--navy);border-radius:7px;padding:9px 11px;margin-top:12px;line-height:1.5}
.insight b{color:var(--navy)}
.insight.g{background:#f1f6e6;border-left-color:var(--green2);color:#4e6019}
.insight.g b{color:#4e6019}
.insight.a{background:#fff6e8;border-left-color:var(--amber);color:#8a5a00}
.insight.a b{color:#8a5a00}
.pills{display:flex;gap:6px;margin-bottom:10px}
.pill{border:1px solid #d3dae3;background:#fff;color:var(--muted);border-radius:16px;padding:4px 12px;font-size:12px</title></style></head>
